<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" shape-rendering="crispEdges">
  <rect width="300" height="400" fill="#141420"/>
  <!-- stacked cartridges -->
  <g>
    <rect x="60" y="220" width="180" height="44" fill="#2a2a44"/>
    <rect x="60" y="220" width="180" height="8" fill="#3a3a5e"/>
    <rect x="72" y="168" width="180" height="44" fill="#243448"/>
    <rect x="72" y="168" width="180" height="8" fill="#34486a"/>
    <rect x="48" y="116" width="180" height="44" fill="#33244a"/>
    <rect x="48" y="116" width="180" height="8" fill="#4a3468"/>
  </g>
  <!-- big question mark -->
  <g fill="#8a7aff">
    <rect x="120" y="44" width="60" height="14"/>
    <rect x="168" y="58" width="14" height="24"/>
    <rect x="140" y="82" width="42" height="14"/>
    <rect x="140" y="96" width="14" height="10"/>
  </g>
  <rect x="140" y="286" width="14" height="14" fill="#8a7aff"/>
  <text x="150" y="326" font-family="monospace" font-size="12" fill="#6a6a90" text-anchor="middle">DOWNLOAD QUEUED…</text>
  <rect x="0" y="352" width="300" height="48" fill="#0c0c16"/>
  <text x="150" y="380" font-family="monospace" font-size="15" font-weight="bold" fill="#d8d8f0" text-anchor="middle">THE BACKLOG</text>
</svg>
