<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" shape-rendering="crispEdges">
  <rect width="300" height="400" fill="#1a1a3e"/>
  <!-- city skyline silhouette -->
  <g fill="#0e0e28" opacity="0.6">
    <rect x="0" y="200" width="40" height="200"/><rect x="44" y="240" width="28" height="160"/>
    <rect x="76" y="220" width="32" height="180"/><rect x="112" y="260" width="16" height="140"/>
    <rect x="172" y="250" width="24" height="150"/><rect x="200" y="210" width="36" height="190"/>
    <rect x="240" y="230" width="28" height="170"/><rect x="272" y="260" width="28" height="140"/>
  </g>
  <!-- web strands (diagonal pixel lines) -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-dasharray="2,2">
    <line x1="0" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="150" y2="200"/>
    <line x1="0" y1="100" x2="100" y2="200"/>
    <line x1="300" y1="100" x2="200" y2="200"/>
  </g>
  <!-- Spider-Man crouching pose (top half - head) -->
  <!-- mask eyes (white) -->
  <rect x="130" y="35" width="8" height="12" fill="#ffffff"/>
  <rect x="162" y="35" width="8" height="12" fill="#ffffff"/>
  <!-- mask outline -->
  <rect x="120" y="30" width="60" height="50" fill="#e82020"/>
  <rect x="125" y="25" width="50" height="5" fill="#e82020"/>
  <rect x="135" y="20" width="30" height="5" fill="#e82020"/>
  <!-- web pattern on mask -->
  <g fill="none" stroke="#cc1818" stroke-width="1">
    <line x1="135" y1="30" x2="135" y2="75"/>
    <line x1="150" y1="20" x2="150" y2="75"/>
    <line x1="165" y1="30" x2="165" y2="75"/>
  </g>
  <!-- Spider-Man body (torso - red) -->
  <rect x="115" y="80" width="70" height="95" fill="#e82020"/>
  <!-- chest spider emblem (black, pixel spider) -->
  <rect x="140" y="100" width="6" height="4" fill="#111111"/>
  <rect x="136" y="104" width="14" height="4" fill="#111111"/>
  <rect x="130" y="108" width="26" height="4" fill="#111111"/>
  <!-- spider legs -->
  <rect x="122" y="100" width="6" height="2" fill="#111111"/>
  <rect x="112" y="96" width="10" height="2" fill="#111111"/>
  <rect x="118" y="108" width="8" height="2" fill="#111111"/>
  <rect x="110" y="112" width="8" height="2" fill="#111111"/>
  <rect x="158" y="100" width="6" height="2" fill="#111111"/>
  <rect x="164" y="96" width="10" height="2" fill="#111111"/>
  <rect x="160" y="108" width="8" height="2" fill="#111111"/>
  <rect x="168" y="112" width="8" height="2" fill="#111111"/>
  <!-- blue side panels on torso -->
  <rect x="110" y="90" width="5" height="75" fill="#2050c0"/>
  <rect x="185" y="90" width="5" height="75" fill="#2050c0"/>
  <rect x="110" y="155" width="60" height="20" fill="#2050c0"/>
  <!-- arms (red) -->
  <rect x="90" y="90" width="20" height="16" fill="#e82020"/>
  <rect x="80" y="96" width="10" height="12" fill="#e82020"/>
  <rect x="190" y="90" width="20" height="16" fill="#e82020"/>
  <rect x="210" y="96" width="10" height="12" fill="#e82020"/>
  <!-- hands (blue gloves) -->
  <rect x="75" y="104" width="12" height="8" fill="#2050c0"/>
  <rect x="213" y="104" width="12" height="8" fill="#2050c0"/>
  <!-- legs (blue) -->
  <rect x="120" y="175" width="24" height="55" fill="#2050c0"/>
  <rect x="156" y="175" width="24" height="55" fill="#2050c0"/>
  <!-- boots (red) -->
  <rect x="118" y="220" width="28" height="15" fill="#e82020"/>
  <rect x="112" y="230" width="16" height="10" fill="#e82020"/>
  <rect x="154" y="220" width="28" height="15" fill="#e82020"/>
  <rect x="172" y="230" width="16" height="10" fill="#e82020"/>
  <!-- action lines -->
  <g fill="#ffd400" opacity="0.7">
    <rect x="70" y="60" width="6" height="2"/><rect x="58" y="80" width="6" height="2"/><rect x="50" y="100" width="10" height="2"/>
    <rect x="224" y="60" width="6" height="2"/><rect x="236" y="80" width="6" height="2"/><rect x="240" y="100" width="10" height="2"/>
  </g>
  <!-- title bar -->
  <rect x="30" y="330" width="240" height="8" fill="#ff2d78"/>
  <rect x="40" y="345" width="220" height="6" fill="#e8e8f4"/>
  <!-- pixel subtitle -->
  <rect x="90" y="360" width="120" height="4" fill="#8f8fb3"/>
  <rect x="110" y="370" width="80" height="3" fill="#8f8fb3"/>
</svg>
