<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" shape-rendering="crispEdges">
  <rect width="300" height="400" fill="#1a0a2e"/>
  <!-- background grid pattern -->
  <g fill="#2d1555" opacity="0.5">
    <rect x="0" y="40" width="60" height="40"/><rect x="120" y="40" width="60" height="40"/><rect x="240" y="40" width="60" height="40"/>
    <rect x="60" y="120" width="60" height="40"/><rect x="180" y="120" width="60" height="40"/>
    <rect x="0" y="200" width="60" height="40"/><rect x="120" y="200" width="60" height="40"/><rect x="240" y="200" width="60" height="40"/>
    <rect x="60" y="280" width="60" height="40"/><rect x="180" y="280" width="60" height="40"/>
  </g>
  <!-- hero silhouette -->
  <rect x="100" y="80" width="100" height="140" fill="#ff2d78"/>
  <rect x="120" y="220" width="60" height="80" fill="#ff2d78"/>
  <rect x="85" y="240" width="30" height="40" fill="#ff2d78"/>
  <rect x="185" y="240" width="30" height="40" fill="#ff2d78"/>
  <!-- star emblem -->
  <rect x="120" y="60" width="60" height="20" fill="#ffd400"/>
  <rect x="135" y="50" width="30" height="10" fill="#ffd400"/>
  <!-- title bar -->
  <rect x="40" y="340" width="220" height="8" fill="#00e5ff"/>
  <rect x="60" y="355" width="180" height="4" fill="#e8e8f4"/>
</svg>
