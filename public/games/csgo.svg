<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" shape-rendering="crispEdges">
  <rect width="300" height="400" fill="#1a1a1a"/>
  <!-- tactical grid background -->
  <g fill="#252525" opacity="0.5">
    <rect x="0" y="0" width="50" height="50"/><rect x="100" y="0" width="50" height="50"/><rect x="200" y="0" width="50" height="50"/>
    <rect x="50" y="50" width="50" height="50"/><rect x="150" y="50" width="50" height="50"/><rect x="250" y="50" width="50" height="50"/>
    <rect x="0" y="100" width="50" height="50"/><rect x="100" y="100" width="50" height="50"/><rect x="200" y="100" width="50" height="50"/>
  </g>
  <!-- CT silhouette (left) -->
  <g fill="#2a5a8a">
    <rect x="60" y="120" width="30" height="60"/>
    <rect x="50" y="110" width="50" height="10"/>
    <rect x="55" y="100" width="40" height="10"/>
    <rect x="65" y="180" width="10" height="50"/>
    <rect x="75" y="180" width="10" height="50"/>
    <rect x="40" y="140" width="10" height="30"/>
    <rect x="90" y="140" width="10" height="30"/>
  </g>
  <!-- T silhouette (right) -->
  <g fill="#c84a2a">
    <rect x="210" y="120" width="30" height="60"/>
    <rect x="200" y="110" width="50" height="10"/>
    <rect x="205" y="100" width="40" height="10"/>
    <rect x="215" y="180" width="10" height="50"/>
    <rect x="225" y="180" width="10" height="50"/>
    <rect x="190" y="140" width="10" height="30"/>
    <rect x="250" y="140" width="10" height="30"/>
  </g>
  <!-- crossed rifles in center -->
  <g fill="#8f8fb3">
    <!-- rifle 1 (angled left) -->
    <rect x="120" y="80" width="8" height="100" transform="rotate(-15 124 130)"/>
    <rect x="100" y="70" width="6" height="30" transform="rotate(-15 103 85)"/>
    <!-- rifle 2 (angled right) -->
    <rect x="172" y="80" width="8" height="100" transform="rotate(15 176 130)"/>
    <rect x="194" y="70" width="6" height="30" transform="rotate(15 197 85)"/>
  </g>
  <!-- bomb icon -->
  <rect x="135" y="140" width="30" height="30" fill="#ffd400"/>
  <rect x="145" y="145" width="10" height="20" fill="#1a1a1a"/>
  <rect x="140" y="135" width="20" height="5" fill="#ffd400"/>
  <!-- defuse kit -->
  <rect x="115" y="165" width="14" height="10" fill="#2a5a8a"/>
  <rect x="171" y="165" width="14" height="10" fill="#c84a2a"/>
  <!-- flash effect -->
  <g fill="#ffffff" opacity="0.3">
    <rect x="130" y="50" width="4" height="4"/><rect x="150" y="45" width="4" height="4"/><rect x="140" y="55" width="2" height="2"/>
    <rect x="160" y="60" width="2" height="2"/><rect x="120" y="65" width="2" height="2"/>
  </g>
  <!-- title bar -->
  <rect x="20" y="330" width="260" height="8" fill="#ffd400"/>
  <rect x="30" y="345" width="240" height="6" fill="#e8e8f4"/>
  <rect x="80" y="360" width="140" height="4" fill="#8f8fb3"/>
  <rect x="100" y="370" width="100" height="3" fill="#8f8fb3"/>
</svg>
