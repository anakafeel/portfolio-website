<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" shape-rendering="crispEdges">
  <rect width="300" height="400" fill="#0a1a2e"/>
  <!-- stadium background tiers -->
  <g fill="#102040" opacity="0.6">
    <rect x="0" y="180" width="300" height="10"/>
    <rect x="10" y="170" width="280" height="10"/>
    <rect x="20" y="160" width="260" height="10"/>
    <rect x="30" y="150" width="240" height="10"/>
  </g>
  <!-- stadium lights -->
  <g fill="#ffd400" opacity="0.8">
    <rect x="40" y="40" width="6" height="6"/><rect x="80" y="35" width="6" height="6"/>
    <rect x="160" y="35" width="6" height="6"/><rect x="200" y="40" width="6" height="6"/>
    <rect x="120" y="30" width="6" height="6"/>
  </g>
  <!-- light beams -->
  <g fill="#ffd400" opacity="0.08">
    <polygon points="43,46 0,200 120,200"/>
    <polygon points="163,41 120,200 300,200"/>
  </g>
  <!-- Rocket League car (octane-style) -->
  <g transform="translate(85, 210)">
    <!-- car body -->
    <rect x="0" y="10" width="130" height="40" fill="#2050c0"/>
    <rect x="5" y="5" width="20" height="5" fill="#2050c0"/>
    <rect x="105" y="5" width="20" height="5" fill="#2050c0"/>
    <!-- car roof/cabin -->
    <rect x="30" y="0" width="70" height="10" fill="#1838a0"/>
    <rect x="40" y="-5" width="50" height="5" fill="#1838a0"/>
    <!-- windshield -->
    <rect x="35" y="0" width="20" height="8" fill="#80c0ff" opacity="0.5"/>
    <!-- wheels -->
    <rect x="15" y="50" width="20" height="15" fill="#222222"/>
    <rect x="12" y="60" width="26" height="5" fill="#444444"/>
    <rect x="95" y="50" width="20" height="15" fill="#222222"/>
    <rect x="92" y="60" width="26" height="5" fill="#444444"/>
    <!-- orange accent stripe -->
    <rect x="40" y="25" width="50" height="6" fill="#ff7a20"/>
    <!-- spoiler -->
    <rect x="110" y="5" width="18" height="8" fill="#2050c0"/>
    <!-- headlights -->
    <rect x="0" y="18" width="4" height="8" fill="#ffd400"/>
    <rect x="0" y="30" width="4" height="8" fill="#ffd400"/>
  </g>
  <!-- boost trail behind car -->
  <g fill="#ff7a20" opacity="0.7">
    <rect x="40" y="230" width="8" height="4"/>
    <rect x="25" y="235" width="10" height="4"/>
    <rect x="10" y="240" width="12" height="4"/>
    <rect x="-5" y="245" width="10" height="4"/>
    <rect x="-15" y="250" width="6" height="4"/>
  </g>
  <!-- boost flames -->
  <g fill="#ffd400" opacity="0.5">
    <rect x="45" y="225" width="4" height="2"/>
    <rect x="30" y="228" width="4" height="2"/>
    <rect x="15" y="233" width="6" height="2"/>
  </g>
  <!-- soccer ball (pixel sphere) -->
  <g transform="translate(200, 130)">
    <rect x="0" y="0" width="40" height="40" rx="0" fill="#ffffff"/>
    <rect x="4" y="4" width="32" height="32" fill="#ffffff"/>
    <!-- pentagon patches -->
    <rect x="14" y="10" width="12" height="12" fill="#222222"/>
    <rect x="8" y="24" width="8" height="8" fill="#222222"/>
    <rect x="24" y="24" width="8" height="8" fill="#222222"/>
    <rect x="18" y="22" width="4" height="4" fill="#222222"/>
    <!-- outline -->
    <rect x="2" y="2" width="36" height="2" fill="#222222"/>
    <rect x="2" y="36" width="36" height="2" fill="#222222"/>
    <rect x="2" y="2" width="2" height="36" fill="#222222"/>
    <rect x="36" y="2" width="2" height="36" fill="#222222"/>
  </g>
  <!-- speed lines -->
  <g fill="#ffffff" opacity="0.2">
    <rect x="0" y="190" width="40" height="2"/><rect x="10" y="200" width="30" height="2"/>
    <rect x="0" y="270" width="35" height="2"/><rect x="15" y="280" width="20" height="2"/>
  </g>
  <!-- scoreboard corners -->
  <g fill="#00ff44" opacity="0.6">
    <rect x="10" y="10" width="30" height="6"/>
    <rect x="260" y="10" width="30" height="6"/>
    <rect x="10" y="24" width="6" height="20"/>
    <rect x="284" y="24" width="6" height="20"/>
  </g>
  <!-- title bar -->
  <rect x="30" y="330" width="240" height="8" fill="#ff7a20"/>
  <rect x="40" y="345" width="220" height="6" fill="#e8e8f4"/>
  <rect x="80" y="360" width="140" height="4" fill="#8f8fb3"/>
  <rect x="100" y="370" width="100" height="3" fill="#8f8fb3"/>
</svg>
