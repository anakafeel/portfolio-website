<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" shape-rendering="crispEdges">
  <rect width="300" height="400" fill="#1a1216"/>
  <!-- descending chevron / drop trail -->
  <g fill="#da292f">
    <rect x="130" y="40" width="40" height="40"/>
    <rect x="110" y="88" width="24" height="24"/><rect x="166" y="88" width="24" height="24"/>
    <rect x="90" y="120" width="24" height="24"/><rect x="186" y="120" width="24" height="24"/>
    <rect x="70" y="152" width="24" height="80"/><rect x="206" y="152" width="24" height="80"/>
    <rect x="94" y="200" width="112" height="24"/>
    <rect x="130" y="152" width="40" height="40" fill="#ff6a5a"/>
  </g>
  <!-- ring closing -->
  <rect x="40" y="260" width="220" height="8" fill="#ffb03a" opacity="0.9"/>
  <rect x="40" y="260" width="8" height="60" fill="#ffb03a" opacity="0.9"/>
  <rect x="252" y="260" width="8" height="60" fill="#ffb03a" opacity="0.9"/>
  <rect x="40" y="312" width="220" height="8" fill="#ffb03a" opacity="0.9"/>
  <text x="150" y="296" font-family="monospace" font-size="12" fill="#ffb03a" text-anchor="middle">RING CLOSING</text>
  <rect x="0" y="352" width="300" height="48" fill="#0f0a0c"/>
  <text x="150" y="380" font-family="monospace" font-size="18" font-weight="bold" fill="#f0e6e8" text-anchor="middle">APEX LEGENDS</text>
</svg>
